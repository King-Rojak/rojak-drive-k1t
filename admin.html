<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Rojak DriveKit - Admin</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --bg:#09090a;
      --surface:#111113;
      --surface2:#18181b;
      --surface3:#1e1e22;
      --line:rgba(255,255,255,.08);
      --text:#f5f5f3;
      --muted:#9999a1;
      --accent:#df5a38;
      --accent2:#ff7955;
      --green:#70d68a;
      --red:#ed7569;
    }

    * {
      box-sizing:border-box;
    }

    body {
      margin:0;
      min-height:100vh;

      background:
        radial-gradient(
          circle at 80% -10%,
          rgba(223,90,56,.13),
          transparent 30%
        ),
        var(--bg);

      color:var(--text);

      font-family:Inter,system-ui,sans-serif;
    }

    button,
    select {
      font:inherit;
    }

    button {
      cursor:pointer;
    }

    .topbar {
      height:76px;

      display:flex;
      align-items:center;
      justify-content:space-between;

      padding:0 28px;

      border-bottom:1px solid var(--line);

      background:rgba(9,9,10,.8);
      backdrop-filter:blur(20px);
    }

    .brand {
      display:flex;
      align-items:center;
      gap:12px;

      font-weight:800;
    }

    .icon {
      width:40px;
      height:40px;

      display:grid;
      place-items:center;

      border-radius:12px;

      background:
        linear-gradient(
          135deg,
          var(--accent),
          var(--accent2)
        );

      font-weight:900;
    }

    .back {
      border:1px solid var(--line);

      background:var(--surface2);
      color:var(--text);

      padding:9px 13px;

      border-radius:10px;
    }

    .container {
      width:min(1100px,calc(100% - 30px));

      margin:auto;

      padding:35px 0 80px;
    }

    h1 {
      margin:0;
      font-size:42px;
      letter-spacing:-2px;
    }

    .sub {
      margin:8px 0 25px;

      color:var(--muted);
      font-size:13px;
    }

    .stats {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;

      margin-bottom:20px;
    }

    .stat {
      padding:20px;

      border:1px solid var(--line);
      border-radius:17px;

      background:var(--surface);
    }

    .stat-label {
      color:var(--muted);
      font-size:12px;
    }

    .stat-value {
      margin-top:8px;

      font-size:28px;
      font-weight:800;
    }

    .card {
      overflow:hidden;

      border:1px solid var(--line);
      border-radius:18px;

      background:var(--surface);
    }

    .table-wrap {
      overflow-x:auto;
    }

    table {
      width:100%;
      border-collapse:collapse;
    }

    th,
    td {
      padding:15px;

      border-bottom:1px solid var(--line);

      text-align:left;

      font-size:12px;
    }

    th {
      color:var(--muted);
      font-size:11px;
    }

    tr:last-child td {
      border-bottom:0;
    }

    .user {
      display:flex;
      align-items:center;
      gap:10px;
    }

    .avatar {
      width:35px;
      height:35px;

      border-radius:50%;

      object-fit:cover;

      background:var(--surface2);
    }

    .name {
      font-weight:700;
    }

    .email {
      margin-top:3px;

      color:var(--muted);
      font-size:10px;
    }

    select {
      padding:8px 10px;

      border:1px solid var(--line);

      border-radius:9px;

      background:var(--surface2);
      color:var(--text);

      outline:none;
    }

    .message {
      padding:25px;

      text-align:center;

      color:var(--muted);
      font-size:13px;
    }

    .error {
      color:var(--red);
    }

    @media(max-width:650px) {

      .topbar {
        padding:0 15px;
      }

      .stats {
        grid-template-columns:1fr;
      }

      h1 {
        font-size:35px;
      }

    }

  </style>

</head>

<body>

  <header class="topbar">

    <div class="brand">

      <div class="icon">
        R
      </div>

      Rojak DriveKit Admin

    </div>

    <button
      id="backButton"
      class="back"
    >
      ← Back
    </button>

  </header>


  <main class="container">

    <h1>
      Admin Dashboard
    </h1>

    <div class="sub">
      Kelola akun Member dan Admin Rojak DriveKit.
    </div>


    <div class="stats">

      <div class="stat">

        <div class="stat-label">
          Total Users
        </div>

        <div
          id="totalUsers"
          class="stat-value"
        >
          0
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          Admin
        </div>

        <div
          id="totalAdmins"
          class="stat-value"
        >
          0
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          Member
        </div>

        <div
          id="totalMembers"
          class="stat-value"
        >
          0
        </div>

      </div>

    </div>


    <div class="card">

      <div
        id="message"
        class="message"
      >
        Memuat pengguna...
      </div>


      <div
        id="tableWrap"
        class="table-wrap"
        style="display:none;"
      >

        <table>

          <thead>

            <tr>

              <th>
                USER
              </th>

              <th>
                ROLE
              </th>

              <th>
                UID
              </th>

            </tr>

          </thead>

          <tbody
            id="usersTable"
          ></tbody>

        </table>

      </div>

    </div>

  </main>


  <script type="module">

    import {
      auth,
      db
    } from "./firebase-config.js";


    import {
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


    import {
      collection,
      getDocs,
      doc,
      getDoc,
      updateDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


    const $ =
      id => document.getElementById(id);


    function escapeHTML(value) {

      return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

    }


    async function loadAdmin() {

      onAuthStateChanged(
        auth,
        async user => {

          if (!user) {

            window.location.href =
              "./index.html";

            return;

          }


          try {

            const currentRef =
              doc(
                db,
                "users",
                user.uid
              );

            const currentSnap =
              await getDoc(
                currentRef
              );


            if (
              !currentSnap.exists() ||
              currentSnap.data().role !== "admin"
            ) {

              $("message").innerHTML =
                `<span class="error">
                  Kamu tidak memiliki akses Admin.
                </span>`;

              return;

            }


            await loadUsers(
              user.uid
            );

          } catch (error) {

            console.error(error);

            $("message").innerHTML =
              `<span class="error">
                Gagal memuat Admin Dashboard.
              </span>`;

          }

        }
      );

    }


    async function loadUsers(
      currentUid
    ) {

      const snapshot =
        await getDocs(
          collection(
            db,
            "users"
          )
        );


      const users =
        snapshot.docs.map(
          item => ({
            id:item.id,
            ...item.data()
          })
        );


      let admins = 0;
      let members = 0;


      users.forEach(user => {

        if (
          user.role === "admin"
        ) {

          admins++;

        } else {

          members++;

        }

      });


      $("totalUsers").textContent =
        users.length;

      $("totalAdmins").textContent =
        admins;

      $("totalMembers").textContent =
        members;


      if (!users.length) {

        $("message").textContent =
          "Belum ada user.";

        return;

      }


      $("message").style.display =
        "none";

      $("tableWrap").style.display =
        "block";


      $("usersTable").innerHTML =
        users.map(user => {

          const photo =
            user.photoURL ||
            "https://www.gravatar.com/avatar/?d=mp";


          const isSelf =
            user.id === currentUid;


          return `

            <tr>

              <td>

                <div class="user">

                  <img
                    class="avatar"
                    src="${escapeHTML(photo)}"
                    alt=""
                  >

                  <div>

                    <div class="name">
                      ${escapeHTML(
                        user.name ||
                        "User"
                      )}
                    </div>

                    <div class="email">
                      ${escapeHTML(
                        user.email ||
                        "-"
                      )}
                    </div>

                  </div>

                </div>

              </td>


              <td>

                ${
                  isSelf

                  ?

                  `<select disabled>
                    <option selected>
                      ADMIN (YOU)
                    </option>
                  </select>`

                  :

                  `<select
                    class="roleSelect"
                    data-uid="${escapeHTML(user.id)}"
                  >

                    <option
                      value="member"
                      ${
                        user.role === "member"
                        ? "selected"
                        : ""
                      }
                    >
                      Member
                    </option>

                    <option
                      value="admin"
                      ${
                        user.role === "admin"
                        ? "selected"
                        : ""
                      }
                    >
                      Admin
                    </option>

                  </select>`
                }

              </td>


              <td>
                ${escapeHTML(user.id)}
              </td>

            </tr>

          `;

        }).join("");


      document
        .querySelectorAll(".roleSelect")
        .forEach(select => {

          select.addEventListener(
            "change",
            async event => {

              const uid =
                event.target.dataset.uid;

              const newRole =
                event.target.value;


              try {

                await updateDoc(
                  doc(
                    db,
                    "users",
                    uid
                  ),
                  {
                    role:newRole,
                    updatedAt:
                      serverTimestamp()
                  }
                );


                await loadUsers(
                  currentUid
                );

              } catch (error) {

                console.error(
                  error
                );

                alert(
                  "Gagal mengubah role: " +
                  (
                    error.code ||
                    error.message
                  )
                );

              }

            }
          );

        });

    }


    $("backButton").onclick =
      () => {

        window.location.href =
          "./index.html";

      };


    loadAdmin();

  </script>

</body>

</html>
