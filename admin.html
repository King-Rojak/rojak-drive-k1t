<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Admin Panel • Rojak DriveKit</title>

<style>
:root{
  --bg:#09090a;
  --surface:#111113;
  --surface2:#19191c;
  --line:rgba(255,255,255,.08);
  --text:#f5f5f3;
  --muted:#9999a1;
  --accent:#df5a38;
  --accent2:#ff7955;
  --green:#70d68a;
  --red:#ed7569;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    radial-gradient(
      circle at 10% 0%,
      rgba(223,90,56,.14),
      transparent 32rem
    ),
    var(--bg);
}

.wrap{
  width:min(1080px,calc(100% - 24px));
  margin:auto;
}

header{
  position:sticky;
  top:0;
  z-index:10;
  padding:18px 0;
  background:rgba(9,9,10,.8);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}

.head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  width:40px;
  height:40px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:linear-gradient(
    145deg,
    var(--accent2),
    var(--accent)
  );
  font-weight:900;
}

.brand h1{
  margin:0;
  font-size:16px;
}

.brand p{
  margin:3px 0 0;
  font-size:10px;
  color:var(--muted);
}

.btn{
  border:1px solid var(--line);
  background:var(--surface2);
  color:var(--text);
  padding:10px 13px;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
}

.btn:hover{
  background:#222226;
}

main{
  padding:32px 0 70px;
}

.eyebrow{
  color:var(--accent2);
  font-size:11px;
  font-weight:800;
  letter-spacing:.13em;
}

.hero h2{
  margin:8px 0;
  font-size:38px;
  letter-spacing:-.04em;
}

.hero p{
  max-width:700px;
  color:var(--muted);
  line-height:1.6;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:22px 0;
}

.stat,
.card{
  border:1px solid var(--line);
  border-radius:17px;
  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.04),
      rgba(255,255,255,.015)
    );
}

.stat{
  padding:18px;
}

.stat span{
  font-size:11px;
  color:var(--muted);
}

.stat strong{
  display:block;
  margin-top:6px;
  font-size:28px;
}

.card{
  overflow:hidden;
}

.bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:16px 18px;
  border-bottom:1px solid var(--line);
}

.bar h3{
  margin:0;
}

.users{
  padding:8px;
}

.user{
  display:grid;
  grid-template-columns:43px 1fr 120px;
  gap:12px;
  align-items:center;
  padding:12px;
  border-bottom:1px solid var(--line);
}

.user:last-child{
  border-bottom:0;
}

.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  object-fit:cover;
  background:#222;
}

.name{
  font-size:12px;
  font-weight:750;
}

.email{
  margin-top:3px;
  font-size:10px;
  color:var(--muted);
}

.select{
  width:100%;
  padding:9px;
  color:var(--text);
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:9px;
}

.status{
  padding:28px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
}

.err{
  color:var(--red);
}

@media(max-width:600px){

  .stats{
    grid-template-columns:1fr;
  }

  .hero h2{
    font-size:30px;
  }

  .user{
    grid-template-columns:40px 1fr;
  }

  .select{
    grid-column:2;
  }
}
</style>
</head>

<body>

<header>
  <div class="wrap head">

    <div class="brand">
      <div class="logo">R</div>

      <div>
        <h1>Rojak DriveKit Admin</h1>
        <p>User & Role Management</p>
      </div>
    </div>

    <button id="back" class="btn">
      ← DriveKit
    </button>

  </div>
</header>

<main class="wrap">

  <section class="hero">

    <div class="eyebrow">
      ADMINISTRATOR
    </div>

    <h2>
      Manage workspace access.
    </h2>

    <p>
      Kelola pengguna dan role Member/Admin.
      Perubahan role disimpan di Firestore dan
      dilindungi oleh Firestore Security Rules.
    </p>

  </section>

  <div class="stats">

    <div class="stat">
      <span>Total Users</span>
      <strong id="total">0</strong>
    </div>

    <div class="stat">
      <span>Admins</span>
      <strong id="admins">0</strong>
    </div>

    <div class="stat">
      <span>Members</span>
      <strong id="members">0</strong>
    </div>

  </div>

  <section class="card">

    <div class="bar">

      <h3>Users</h3>

      <button id="refresh" class="btn">
        Refresh
      </button>

    </div>

    <div id="users" class="users">

      <div class="status">
        Memuat pengguna...
      </div>

    </div>

  </section>

</main>

<script type="module">

import {
  auth,
  db
} from "./firebase-config.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  collection,
  getDocs,
  doc,
  getDoc,
  updateDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const $ = id => document.getElementById(id);

let currentUser = null;


function escapeHtml(value){

  return String(value).replace(
    /[&<>"']/g,
    char => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[char])
  );

}


async function checkAdmin(user){

  const snap = await getDoc(
    doc(db,"users",user.uid)
  );

  return (
    snap.exists() &&
    snap.data().role === "admin"
  );

}


async function loadUsers(){

  $("users").innerHTML =
    '<div class="status">Memuat pengguna...</div>';

  try{

    const snapshot =
      await getDocs(collection(db,"users"));

    const users =
      snapshot.docs.map(d => ({
        id:d.id,
        ...d.data()
      }));

    const adminCount =
      users.filter(
        user => user.role === "admin"
      ).length;

    $("total").textContent = users.length;
    $("admins").textContent = adminCount;
    $("members").textContent =
      users.length - adminCount;


    if(!users.length){

      $("users").innerHTML =
        '<div class="status">Belum ada pengguna.</div>';

      return;
    }


    $("users").innerHTML =
      users.map(user => `

        <div class="user">

          <img
            class="avatar"
            src="${escapeHtml(user.photoURL || "")}"
            alt=""
            onerror="this.style.visibility='hidden'"
          >

          <div>

            <div class="name">
              ${escapeHtml(user.name || "User")}
            </div>

            <div class="email">
              ${escapeHtml(user.email || "-")}
            </div>

          </div>

          <select
            class="select"
            data-uid="${user.id}"
            data-old="${user.role || "member"}"
          >

            <option
              value="member"
              ${
                (user.role || "member") === "member"
                  ? "selected"
                  : ""
              }
            >
              Member
            </option>

            <option
              value="admin"
              ${
                (user.role || "member") === "admin"
                  ? "selected"
                  : ""
              }
            >
              Admin
            </option>

          </select>

        </div>

      `).join("");


    document
      .querySelectorAll("[data-uid]")
      .forEach(select => {

        select.onchange =
          () => changeRole(select);

      });


  }catch(error){

    console.error(error);

    $("users").innerHTML =
      '<div class="status err">Gagal membaca user. Pastikan Firestore Rules sudah dipasang.</div>';

  }

}


async function changeRole(select){

  const uid =
    select.dataset.uid;

  const oldRole =
    select.dataset.old;

  const newRole =
    select.value;


  if(
    uid === currentUser.uid &&
    newRole !== "admin"
  ){

    alert(
      "Akun Admin yang sedang digunakan tidak bisa menurunkan role dirinya sendiri."
    );

    select.value = "admin";

    return;
  }


  try{

    await updateDoc(
      doc(db,"users",uid),
      {
        role:newRole,
        updatedAt:serverTimestamp()
      }
    );

    select.dataset.old =
      newRole;

    await loadUsers();

  }catch(error){

    console.error(error);

    alert(
      "Role gagal diubah. Pastikan akun kamu masih Admin."
    );

    select.value =
      oldRole;

  }

}


$("back").onclick = () => {

  location.href =
    "index.html";

};


$("refresh").onclick =
  loadUsers;


onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      location.href =
        "index.html";

      return;
    }

    currentUser =
      user;

    try{

      const admin =
        await checkAdmin(user);

      if(!admin){

        $("users").innerHTML =
          '<div class="status err">Akses ditolak. Halaman ini hanya untuk Admin.</div>';

        return;
      }

      await loadUsers();

    }catch(error){

      console.error(error);

      $("users").innerHTML =
        '<div class="status err">Akses ditolak.</div>';

    }

  }
);

</script>

</body>
</html>
