<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/png" href="https://files.catbox.moe/brdrmx.png"><title>Rojak DriveK1t · Admin</title>
<style>
:root{--bg:#0b0b0c;--surface:#111112;--surface2:#171718;--line:#29292b;--text:#e7e7e9;--muted:#8b8b91;--accent:#e45632;--red:#d8665c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer}.topbar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);background:var(--surface)}.brand{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:700}.brand-mark{width:30px;height:30px;border:1px solid var(--line);border-radius:7px;overflow:hidden}.brand-mark img{width:100%;height:100%;object-fit:cover}.back{height:31px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);color:var(--muted)}.container{width:min(1040px,calc(100% - 32px));margin:auto;padding:38px 0 60px}.head h1{margin:0;font-size:26px}.head p{margin:6px 0 22px;color:var(--muted);font-size:10px}.summary{display:flex;gap:18px;padding:11px 0;border-block:1px solid var(--line);font-size:9px;color:var(--muted)}.summary b{color:var(--text)}.section{margin-top:27px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.section-title{font-size:12px;margin:0}.help{font-size:8px;color:var(--muted)}.card{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}.table-head,.user-row{display:grid;grid-template-columns:minmax(260px,1fr) 120px 210px;align-items:center}.table-head{min-height:36px;padding:0 12px;border-bottom:1px solid var(--line);color:var(--muted);font-size:8px;font-weight:700}.user-row{min-height:66px;padding:8px 12px;border-bottom:1px solid var(--line)}.user-row:last-child{border-bottom:0}.user-main{display:flex;gap:10px;align-items:center}.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#222}.name{font-size:10px;font-weight:700}.email{font-size:8px;color:var(--muted);margin-top:3px}.uid{font:8px ui-monospace,monospace;color:#666;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}select,input{width:100%;height:34px;padding:0 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);color:var(--text);outline:0}select:focus,input:focus{border-color:var(--accent)}.upload{padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;grid-column:1/-1}.btn{height:31px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);color:var(--text);font-size:9px;font-weight:700}.btn.primary{background:var(--accent);border-color:var(--accent);color:#111}.btn.danger{color:#ffb0aa;border-color:#542020}.btn:disabled{opacity:.45}.status{padding:30px;text-align:center;color:var(--muted);font-size:9px}.music-row{display:grid;grid-template-columns:50px minmax(0,1fr) 90px 90px;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}.music-row:last-child{border-bottom:0}.cover{width:44px;height:44px;border-radius:7px;object-fit:cover;background:#222}.song-title{font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.song-artist{font-size:8px;color:var(--muted);margin-top:3px}@media(max-width:700px){.topbar{padding:0 12px}.container{width:calc(100% - 20px);padding:28px 0}.summary{flex-wrap:wrap}.table-head{display:none}.user-row{display:block}.user-main{margin-bottom:10px}.uid{margin-top:8px}.upload{grid-template-columns:1fr}.full{grid-column:auto}.actions{grid-column:auto}.music-row{grid-template-columns:44px minmax(0,1fr)}.music-row .btn{width:100%}}
</style></head>
<body>
<header class="topbar"><div class="brand"><div class="brand-mark"><img src="https://files.catbox.moe/brdrmx.png"></div><span>Rojak DriveK1t · Admin</span></div><button id="back" class="back">← Kembali</button></header>
<main class="container"><div class="head"><h1>Admin</h1><p>Kelola pengguna dan music Rojak DriveK1t.</p></div><div class="summary"><span>Users <b id="usersCount">0</b></span><span>Admin <b id="adminCount">0</b></span><span>Member <b id="memberCount">0</b></span><span>Music <b id="musicCount">0</b></span></div>
<section class="section"><div class="section-head"><h2 class="section-title">Daftar pengguna</h2><span class="help">Role dapat diubah Admin.</span></div><div id="users" class="card"><div class="status">Memuat...</div></div></section>
<section class="section"><div class="section-head"><h2 class="section-title">Tambah music</h2><span class="help">MP3 maksimal 4 MB.</span></div><form id="form" class="card upload"><label>Judul<input id="title" required placeholder="Judul lagu"></label><label>Artist<input id="artist" required placeholder="Nama artist"></label><label class="full">MP3<input id="mp3" type="file" accept=".mp3,audio/mpeg" required></label><label class="full">Cover<input id="cover" type="file" accept="image/jpeg,image/png,image/webp" required></label><div class="help full">MP3 + cover masuk GitHub. Metadata masuk Firestore.</div><div class="actions"><button id="upload" class="btn primary" type="submit">+ Upload Music</button></div></form></section>
<section class="section"><div class="section-head"><h2 class="section-title">Music</h2><span class="help">Daftar lagu.</span></div><div id="music" class="card"><div class="status">Memuat...</div></div></section></main>
<script type="module">
import{auth,db}from"./firebase-config.js";import{GoogleAuthProvider,signInWithPopup,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";import{collection,getDocs,doc,getDoc,updateDoc,serverTimestamp,query,orderBy}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
const $=id=>document.getElementById(id);const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");let me=null;
async function checkAdmin(){const s=await getDoc(doc(db,"users",me.uid));if(!s.exists()||s.data().role!=="admin"){alert("Akses Admin diperlukan.");location.href="index.html";throw new Error("not admin");}}
async function loadUsers(){const s=await getDocs(collection(db,"users"));const u=s.docs.map(d=>({id:d.id,...d.data()}));const a=u.filter(x=>x.role==="admin").length;$("usersCount").textContent=u.length;$("adminCount").textContent=a;$("memberCount").textContent=u.length-a;$("users").innerHTML='<div class="table-head"><div>USER</div><div>ROLE</div><div>UID</div></div>'+u.map(x=>`<div class="user-row"><div class="user-main"><img class="avatar" src="${esc(x.photoURL||"https://files.catbox.moe/brdrmx.png")}"><div><div class="name">${esc(x.name||"User")}${x.uid===me.uid?" · YOU":""}</div><div class="email">${esc(x.email||"")}</div></div></div><div>${x.uid===me.uid?'<span style="font-size:8px;color:#db5d3d;font-weight:700">ADMIN · YOU</span>':`<select data-role="${esc(x.uid)}"><option value="member" ${x.role!=="admin"?"selected":""}>Member</option><option value="admin" ${x.role==="admin"?"selected":""}>Admin</option></select>`}</div><div class="uid">${esc(x.uid)}</div></div>`).join("");document.querySelectorAll("[data-role]").forEach(s=>s.onchange=async()=>{s.disabled=true;try{await updateDoc(doc(db,"users",s.dataset.role),{role:s.value,updatedAt:serverTimestamp()});await loadUsers()}catch(e){alert(e.message);s.disabled=false}})}
async function loadMusic(){const s=await getDocs(query(collection(db,"music"),orderBy("createdAt","desc")));const arr=s.docs.map(d=>({id:d.id,...d.data()}));$("musicCount").textContent=arr.length;if(!arr.length){$("music").innerHTML='<div class="status">Belum ada music.</div>';return}$("music").innerHTML=arr.map(x=>`<div class="music-row"><img class="cover" src="${esc(x.coverUrl||"https://files.catbox.moe/brdrmx.png")}"><div><div class="song-title">${esc(x.title)}</div><div class="song-artist">${esc(x.artist)}</div></div><a class="btn" href="${esc(x.audioUrl)}" target="_blank">Open</a><button class="btn danger" data-del="${esc(x.id)}">Hapus</button></div>`).join("");document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(!confirm("Hapus lagu ini dari GitHub + Firestore?"))return;b.disabled=true;try{const token=await me.getIdToken();const r=await fetch("/api/music",{method:"DELETE",headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify({id:b.dataset.del})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Gagal menghapus");await loadMusic()}catch(e){alert(e.message);b.disabled=false}})}
$("form").onsubmit=async e=>{e.preventDefault();const b=$("upload"),mp3=$("mp3").files[0],cover=$("cover").files[0];if(!mp3||!cover)return;if(mp3.size>4*1024*1024){alert("MP3 maksimal 4 MB.");return}b.disabled=true;b.textContent="Mengupload...";try{const token=await me.getIdToken();const f=new FormData();f.append("title",$("title").value);f.append("artist",$("artist").value);f.append("mp3",mp3);f.append("cover",cover);const r=await fetch("/api/music",{method:"POST",headers:{Authorization:"Bearer "+token},body:f});const d=await r.json();if(!r.ok)throw new Error(d.error||"Upload gagal");$("form").reset();await loadMusic();alert("Music berhasil ditambahkan.")}catch(e){alert(e.message)}finally{b.disabled=false;b.textContent="+ Upload Music"}};
$("back").onclick=()=>location.href="index.html";
onAuthStateChanged(auth,async user=>{if(!user){try{const p=new GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});await signInWithPopup(auth,p)}catch(e){alert("Login Admin gagal.");location.href="index.html"}return}me=user;try{await checkAdmin();await Promise.all([loadUsers(),loadMusic()])}catch(e){console.error(e)}});
</script>
<div id="githubDiagnostic" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:9999;align-items:center;justify-content:center;padding:20px;">
  <div style="width:min(520px,100%);background:#151614;border:1px solid #292a27;border-radius:10px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.45);">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
      <strong>GitHub Diagnostic</strong>
      <button id="closeGithubDiagnostic" type="button">Tutup</button>
    </div>
    <pre id="githubDiagnosticText" style="margin:14px 0 0;white-space:pre-wrap;word-break:break-word;color:#bdbdbd;font-size:12px;line-height:1.6;"></pre>
  </div>
</div>
<script>
window.openGithubDiagnostic = async function () {
  const box = document.getElementById('githubDiagnostic');
  const text = document.getElementById('githubDiagnosticText');
  box.style.display = 'flex';
  text.textContent = 'Mengecek GitHub...';
  try {
    const user = window.firebaseAuth?.currentUser;
    if (!user) throw new Error('Login Firebase belum tersedia.');
    const token = await user.getIdToken(true);
    const response = await fetch('/api/music?diagnose=1', {
      headers: { Authorization: 'Bearer ' + token }
    });
    const data = await response.json();
    text.textContent = JSON.stringify(data, null, 2);
  } catch (error) {
    text.textContent = error.message || String(error);
  }
};
window.addEventListener('DOMContentLoaded', function(){
  const close = document.getElementById('closeGithubDiagnostic');
  if (close) close.onclick = () => document.getElementById('githubDiagnostic').style.display='none';
});
</script>
</body></html>
