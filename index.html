<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rojak DriveKit</title>

  <!-- Google API -->
  <script src="https://apis.google.com/js/api.js"></script>
  <script src="https://accounts.google.com/gsi/client"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background:
        radial-gradient(circle at top right, #5d1c14 0%, transparent 35%),
        linear-gradient(135deg, #0b0b0b, #15100f);
      color: #fff;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: auto;
    }

    header {
      margin-bottom: 25px;
    }

    .brand {
      font-size: 27px;
      font-weight: 800;
    }

    .brand span {
      color: #e45c35;
    }

    .subtitle {
      color: #999;
      margin-top: 6px;
      font-size: 14px;
    }

    .card {
      background: rgba(25, 25, 25, 0.88);
      border: 1px solid #292929;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
      backdrop-filter: blur(15px);
    }

    .login-box {
      text-align: center;
      padding: 30px 10px;
    }

    .google-btn {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #fff;
      color: #111;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    .google-btn:hover {
      opacity: .9;
    }

    .app {
      display: none;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      color: #ddd;
      font-size: 14px;
      font-weight: 600;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #333;
      background: #101010;
      color: white;
      border-radius: 12px;
      padding: 13px;
      outline: none;
      font-size: 14px;
    }

    input:focus,
    textarea:focus {
      border-color: #d95732;
    }

    textarea {
      min-height: 220px;
      resize: vertical;
      line-height: 1.5;
    }

    .create-btn {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #e75c35, #9e2d1d);
      color: white;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .create-btn:hover {
      filter: brightness(1.1);
    }

    .create-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 18px;
      padding: 13px;
      border-radius: 12px;
      background: #171717;
      color: #aaa;
      font-size: 13px;
      line-height: 1.5;
      display: none;
    }

    .status.success {
      display: block;
      color: #8ee6a8;
      border: 1px solid #275a35;
    }

    .status.error {
      display: block;
      color: #ff8d8d;
      border: 1px solid #6b2929;
    }

    .file-link {
      display: inline-block;
      margin-top: 8px;
      color: #ff8a62;
      text-decoration: none;
      font-weight: 700;
    }

    .logout {
      margin-top: 12px;
      width: 100%;
      padding: 11px;
      border: 1px solid #333;
      background: transparent;
      color: #aaa;
      border-radius: 10px;
      cursor: pointer;
    }

    .account {
      font-size: 13px;
      color: #888;
      margin-top: 15px;
    }

    footer {
      text-align: center;
      color: #555;
      font-size: 12px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <div class="brand">Rojak <span>DriveKit</span></div>
    <div class="subtitle">
      Create TXT files directly in your Google Drive
    </div>
  </header>

  <!-- LOGIN -->
  <div class="card login-box" id="loginBox">

    <h2>Connect Google Drive</h2>

    <p class="subtitle">
      Hubungkan akun Google untuk membuat file TXT langsung ke Drive.
    </p>

    <button class="google-btn" onclick="loginGoogle()">
      Continue with Google
    </button>

    <div class="status" id="loginStatus"></div>

  </div>


  <!-- APP -->
  <div class="card app" id="appBox">

    <h2>Create TXT File</h2>

    <div class="account" id="accountInfo">
      Google Drive connected
    </div>

    <label for="fileName">
      Nama File
    </label>

    <input
      id="fileName"
      type="text"
      placeholder="contoh: catatan-sekolah"
      autocomplete="off"
    >

    <label for="fileContent">
      Isi File
    </label>

    <textarea
      id="fileContent"
      placeholder="Tulis isi file TXT di sini..."
    ></textarea>

    <button
      class="create-btn"
      id="createBtn"
      onclick="createTxtFile()"
    >
      ⚡ BUAT FILE TXT
    </button>

    <div class="status" id="status"></div>

    <button class="logout" onclick="logoutGoogle()">
      Keluar dari Google
    </button>

  </div>

  <footer>
    Rojak DriveKit · Google Drive Tools
  </footer>

</div>


<script>

  /*
  ==========================================================
  CONFIGURATION
  ==========================================================
  */

  // GANTI DENGAN CLIENT ID KAMU
  const CLIENT_ID =
    "222625790422-d3ii7pisd170rge4o5rnaamn58fqdo2j.apps.googleusercontent.com";

  const SCOPES =
    "https://www.googleapis.com/auth/drive.file";

  const DISCOVERY_DOC =
    "https://www.googleapis.com/discovery/v1/apis/drive/v3/rest";


  /*
  ==========================================================
  VARIABLES
  ==========================================================
  */

  let tokenClient;
  let gapiInited = false;
  let gisInited = false;


  /*
  ==========================================================
  GOOGLE API
  ==========================================================
  */

  function gapiLoaded() {
    gapi.load("client", initializeGapiClient);
  }


  async function initializeGapiClient() {

    try {

      await gapi.client.init({
        discoveryDocs: [DISCOVERY_DOC]
      });

      gapiInited = true;

    } catch (error) {

      console.error(error);

      showLoginError(
        "Google API gagal dimuat."
      );

    }

  }


  /*
  ==========================================================
  GOOGLE IDENTITY SERVICES
  ==========================================================
  */

  function gisLoaded() {

    tokenClient = google.accounts.oauth2.initTokenClient({

      client_id: CLIENT_ID,

      scope: SCOPES,

      callback: ""

    });

    gisInited = true;

  }


  /*
  ==========================================================
  LOGIN
  ==========================================================
  */

  function loginGoogle() {

    if (!gapiInited || !gisInited) {

      showLoginError(
        "Google belum selesai dimuat. Tunggu beberapa detik lalu coba lagi."
      );

      return;
    }

    tokenClient.callback = async (response) => {

      if (response.error !== undefined) {

        console.error(response);

        showLoginError(
          "Login Google gagal."
        );

        return;
      }

      document.getElementById("loginBox").style.display = "none";

      document.getElementById("appBox").style.display = "block";

      document.getElementById("accountInfo").innerText =
        "✓ Google Drive connected";

    };


    if (
      gapi.client.getToken() === null
    ) {

      tokenClient.requestAccessToken({
        prompt: "consent"
      });

    } else {

      tokenClient.requestAccessToken({
        prompt: ""
      });

    }

  }


  /*
  ==========================================================
  CREATE TXT
  ==========================================================
  */

  async function createTxtFile() {

    const nameInput =
      document.getElementById("fileName");

    const contentInput =
      document.getElementById("fileContent");

    const button =
      document.getElementById("createBtn");


    let fileName =
      nameInput.value.trim();

    const content =
      contentInput.value;


    if (!fileName) {

      showStatus(
        "Masukkan nama file terlebih dahulu.",
        "error"
      );

      nameInput.focus();

      return;
    }


    /*
    Tambahkan .txt otomatis
    */

    if (!fileName.toLowerCase().endsWith(".txt")) {

      fileName += ".txt";

    }


    /*
    Pastikan user sudah login
    */

    const token =
      gapi.client.getToken();

    if (!token) {

      showStatus(
        "Silakan hubungkan Google Drive terlebih dahulu.",
        "error"
      );

      return;

    }


    button.disabled = true;

    button.innerText =
      "⏳ Membuat file...";


    try {

      /*
      Metadata file
      */

      const metadata = {

        name: fileName,

        mimeType: "text/plain"

      };


      /*
      Isi TXT
      */

      const blob =
        new Blob(
          [content],
          { type: "text/plain" }
        );


      /*
      Multipart upload
      */

      const form =
        new FormData();

      form.append(
        "metadata",
        new Blob(
          [JSON.stringify(metadata)],
          { type: "application/json" }
        )
      );

      form.append(
        "file",
        blob
      );


      const response =
        await fetch(
          "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink",
          {
            method: "POST",

            headers: {
              Authorization:
                "Bearer " +
                token.access_token
            },

            body: form
          }
        );


      const result =
        await response.json();


      if (!response.ok) {

        console.error(result);

        throw new Error(
          result.error?.message ||
          "Gagal membuat file."
        );

      }


      /*
      Berhasil
      */

      showStatus(
        `
        ✓ File berhasil dibuat!<br>
        <a
          class="file-link"
          href="https://drive.google.com/file/d/${result.id}/view"
          target="_blank"
        >
          Buka file di Google Drive →
        </a>
        `,
        "success"
      );


      /*
      Reset form
      */

      nameInput.value = "";

      contentInput.value = "";


    } catch (error) {

      console.error(error);

      showStatus(
        "Gagal membuat file: " +
        error.message,
        "error"
      );

    }


    button.disabled = false;

    button.innerText =
      "⚡ BUAT FILE TXT";

  }


  /*
  ==========================================================
  STATUS
  ==========================================================
  */

  function showStatus(
    message,
    type
  ) {

    const status =
      document.getElementById("status");

    status.innerHTML =
      message;

    status.className =
      "status " + type;

  }


  function showLoginError(
    message
  ) {

    const status =
      document.getElementById("loginStatus");

    status.innerHTML =
      message;

    status.className =
      "status error";

  }


  /*
  ==========================================================
  LOGOUT
  ==========================================================
  */

  function logoutGoogle() {

    const token =
      gapi.client.getToken();

    if (token !== null) {

      google.accounts.oauth2.revoke(
        token.access_token
      );

      gapi.client.setToken("");

    }

    document.getElementById("appBox")
      .style.display = "none";

    document.getElementById("loginBox")
      .style.display = "block";

  }


  /*
  ==========================================================
  LOAD GOOGLE LIBRARIES
  ==========================================================
  */

  window.addEventListener(
    "load",
    () => {

      gapiLoaded();

      gisLoaded();

    }
  );

</script>

</body>
</html>
