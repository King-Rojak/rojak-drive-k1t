<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rojak DriveKit</title>

  <script src="https://apis.google.com/js/api.js"></script>
  <script src="https://accounts.google.com/gsi/client"></script>

  <style>
    :root {
      --bg: #11110f;
      --panel: #181816;
      --input: #0f0f0d;
      --border: #2b2b27;
      --text: #eeeeea;
      --muted: #8d8d85;
      --accent: #d95735;
      --accent-hover: #ed6945;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    .page {
      width: min(680px, calc(100% - 32px));
      margin: 0 auto;
      padding: 42px 0 30px;
    }

    /* HEADER */

    .header {
      margin-bottom: 32px;
    }

    .logo {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .logo span {
      color: var(--accent);
    }

    .description {
      margin-top: 7px;
      color: var(--muted);
      font-size: 14px;
    }

    /* CARD */

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
    }

    /* LOGIN */

    .login {
      text-align: center;
      padding: 42px 24px;
    }

    .login h1 {
      margin: 0;
      font-size: 21px;
      font-weight: 650;
    }

    .login p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      max-width: 390px;
      margin: 10px auto 0;
    }

    /* BUTTON */

    button {
      font-family: inherit;
    }

    .google-button {
      width: 100%;
      max-width: 330px;
      margin-top: 24px;
      padding: 12px 16px;

      border: 1px solid #343430;
      border-radius: 8px;

      background: #f2f2ee;
      color: #161614;

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;
    }

    .google-button:hover {
      background: #ffffff;
    }

    /* APP */

    .app {
      display: none;
    }

    .section-title {
      margin: 0;
      font-size: 18px;
      font-weight: 650;
    }

    .connected {
      margin-top: 7px;
      color: #777770;
      font-size: 12px;
    }

    /* FORM */

    .field {
      margin-top: 24px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #c8c8c1;
      font-size: 13px;
      font-weight: 600;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;

      background: var(--input);
      color: var(--text);

      padding: 12px 13px;

      font-family: inherit;
      font-size: 14px;

      outline: none;
      transition: border-color .15s;
    }

    input {
      height: 44px;
    }

    textarea {
      min-height: 230px;
      resize: vertical;
      line-height: 1.5;
    }

    input:focus,
    textarea:focus {
      border-color: #55554e;
    }

    input::placeholder,
    textarea::placeholder {
      color: #55554e;
    }

    /* CREATE */

    .create-button {
      width: 100%;
      height: 44px;

      margin-top: 22px;

      border: 0;
      border-radius: 8px;

      background: var(--accent);
      color: white;

      font-size: 14px;
      font-weight: 650;

      cursor: pointer;
    }

    .create-button:hover {
      background: var(--accent-hover);
    }

    .create-button:disabled {
      opacity: .5;
      cursor: default;
    }

    /* STATUS */

    .status {
      display: none;

      margin-top: 16px;
      padding: 12px 13px;

      border: 1px solid var(--border);
      border-radius: 8px;

      background: #121210;

      font-size: 13px;
      line-height: 1.5;
    }

    .status.success {
      display: block;
      color: #a7d8ae;
    }

    .status.error {
      display: block;
      color: #e99a8c;
    }

    .file-link {
      display: inline-block;
      margin-top: 5px;

      color: #df7658;
      text-decoration: none;
    }

    .file-link:hover {
      text-decoration: underline;
    }

    /* LOGOUT */

    .logout {
      width: 100%;
      height: 40px;

      margin-top: 10px;

      border: 1px solid var(--border);
      border-radius: 8px;

      background: transparent;
      color: #85857e;

      font-size: 13px;
      cursor: pointer;
    }

    .logout:hover {
      color: #c4c4bc;
      border-color: #44443e;
    }

    /* FOOTER */

    footer {
      margin-top: 18px;

      text-align: center;

      color: #55554f;
      font-size: 11px;
    }

    /* MOBILE */

    @media (max-width: 520px) {
      .page {
        width: min(100% - 24px, 680px);
        padding-top: 28px;
      }

      .panel {
        padding: 18px;
      }

      .login {
        padding: 32px 18px;
      }

      .header {
        margin-bottom: 22px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <!-- HEADER -->

    <header class="header">
      <div class="logo">
        Rojak <span>DriveKit</span>
      </div>

      <div class="description">
        Small tools for Google Drive.
      </div>
    </header>


    <!-- LOGIN -->

    <section class="panel login" id="loginBox">

      <h1>Connect Google Drive</h1>

      <p>
        Connect your Google account to create files
        directly in your Drive.
      </p>

      <button
        class="google-button"
        onclick="loginGoogle()"
      >
        Continue with Google
      </button>

      <div
        class="status"
        id="loginStatus"
      ></div>

    </section>


    <!-- APP -->

    <section
      class="panel app"
      id="appBox"
    >

      <h2 class="section-title">
        New text file
      </h2>

      <div
        class="connected"
        id="accountInfo"
      >
        Google Drive connected
      </div>


      <!-- FILE NAME -->

      <div class="field">

        <label for="fileName">
          File name
        </label>

        <input
          id="fileName"
          type="text"
          placeholder="contoh: catatan-sekolah"
          autocomplete="off"
        >

      </div>


      <!-- CONTENT -->

      <div class="field">

        <label for="fileContent">
          Content
        </label>

        <textarea
          id="fileContent"
          placeholder="Tulis isi file di sini..."
        ></textarea>

      </div>


      <!-- CREATE -->

      <button
        class="create-button"
        id="createBtn"
        onclick="createTxtFile()"
      >
        Create file
      </button>


      <!-- STATUS -->

      <div
        class="status"
        id="status"
      ></div>


      <!-- LOGOUT -->

      <button
        class="logout"
        onclick="logoutGoogle()"
      >
        Disconnect Google Drive
      </button>

    </section>


    <footer>
      Rojak DriveKit
    </footer>

  </main>


  <script>

    /* =========================================
       GOOGLE CONFIG
       ========================================= */

    const CLIENT_ID =
      "222625790422-7j7nhagd4d7gdpaqhq257deucjjfanva.apps.googleusercontent.com";

    const SCOPES =
      "https://www.googleapis.com/auth/drive.file";

    const DISCOVERY_DOC =
      "https://www.googleapis.com/discovery/v1/apis/drive/v3/rest";


    let tokenClient;
    let gapiInited = false;
    let gisInited = false;


    /* =========================================
       GOOGLE API
       ========================================= */

    function gapiLoaded() {

      gapi.load(
        "client",
        initializeGapiClient
      );

    }


    async function initializeGapiClient() {

      try {

        await gapi.client.init({
          discoveryDocs: [
            DISCOVERY_DOC
          ]
        });

        gapiInited = true;

      } catch (error) {

        console.error(error);

        showLoginError(
          "Google API gagal dimuat."
        );

      }

    }


    /* =========================================
       GOOGLE LOGIN
       ========================================= */

    function gisLoaded() {

      tokenClient =
        google.accounts.oauth2.initTokenClient({

          client_id: CLIENT_ID,

          scope: SCOPES,

          callback: ""

        });

      gisInited = true;

    }


    function loginGoogle() {

      if (
        !gapiInited ||
        !gisInited
      ) {

        showLoginError(
          "Google belum selesai dimuat. Coba lagi."
        );

        return;

      }


      tokenClient.callback =
        async (response) => {

          if (
            response.error !== undefined
          ) {

            console.error(response);

            showLoginError(
              "Login Google gagal."
            );

            return;

          }


          document
            .getElementById("loginBox")
            .style.display = "none";


          document
            .getElementById("appBox")
            .style.display = "block";

        };


      const token =
        gapi.client.getToken();


      if (token === null) {

        tokenClient.requestAccessToken({
          prompt: "consent"
        });

      } else {

        tokenClient.requestAccessToken({
          prompt: ""
        });

      }

    }


    /* =========================================
       CREATE TXT
       ========================================= */

    async function createTxtFile() {

      const nameInput =
        document.getElementById(
          "fileName"
        );

      const contentInput =
        document.getElementById(
          "fileContent"
        );

      const button =
        document.getElementById(
          "createBtn"
        );


      let fileName =
        nameInput.value.trim();

      const content =
        contentInput.value;


      if (!fileName) {

        showStatus(
          "Masukkan nama file.",
          "error"
        );

        nameInput.focus();

        return;

      }


      if (
        !fileName
          .toLowerCase()
          .endsWith(".txt")
      ) {

        fileName += ".txt";

      }


      const token =
        gapi.client.getToken();


      if (!token) {

        showStatus(
          "Hubungkan Google Drive terlebih dahulu.",
          "error"
        );

        return;

      }


      button.disabled = true;

      button.textContent =
        "Creating...";


      try {

        const metadata = {

          name: fileName,

          mimeType: "text/plain"

        };


        const blob =
          new Blob(
            [content],
            {
              type: "text/plain"
            }
          );


        const form =
          new FormData();


        form.append(
          "metadata",
          new Blob(
            [
              JSON.stringify(
                metadata
              )
            ],
            {
              type:
                "application/json"
            }
          )
        );


        form.append(
          "file",
          blob
        );


        const response =
          await fetch(

            "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink",

            {

              method: "POST",

              headers: {

                Authorization:
                  "Bearer " +
                  token.access_token

              },

              body: form

            }

          );


        const result =
          await response.json();


        if (!response.ok) {

          console.error(result);

          throw new Error(
            result.error?.message ||
            "Gagal membuat file."
          );

        }


        showStatus(

          `
          File created successfully.<br>
          <a
            class="file-link"
            href="https://drive.google.com/file/d/${result.id}/view"
            target="_blank"
          >
            Open in Google Drive
          </a>
          `,

          "success"

        );


        nameInput.value = "";

        contentInput.value = "";


      } catch (error) {

        console.error(error);

        showStatus(

          "Gagal membuat file: " +
          error.message,

          "error"

        );

      }


      button.disabled = false;

      button.textContent =
        "Create file";

    }


    /* =========================================
       STATUS
       ========================================= */

    function showStatus(
      message,
      type
    ) {

      const status =
        document.getElementById(
          "status"
        );

      status.innerHTML =
        message;

      status.className =
        "status " + type;

    }


    function showLoginError(
      message
    ) {

      const status =
        document.getElementById(
          "loginStatus"
        );

      status.innerHTML =
        message;

      status.className =
        "status error";

    }


    /* =========================================
       LOGOUT
       ========================================= */

    function logoutGoogle() {

      const token =
        gapi.client.getToken();


      if (token !== null) {

        google.accounts.oauth2.revoke(
          token.access_token
        );

        gapi.client.setToken("");

      }


      document
        .getElementById("appBox")
        .style.display = "none";


      document
        .getElementById("loginBox")
        .style.display = "block";

    }


    /* =========================================
       INITIALIZE
       ========================================= */

    window.addEventListener(
      "load",
      () => {

        gapiLoaded();

        gisLoaded();

      }
    );

  </script>

</body>
</html>
